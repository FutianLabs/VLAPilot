[project]
name = "vlapilot"
version = "0.1.0"
description = "Plan-mode VLA pilot: MCP planner plus Pi0.5/Piper backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx[http2]>=0.27.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
examples = [
    "torch>=2.1.0",
    "lerobot>=0.4.0",
    "volcengine-python-sdk[ark]>=4.0.43",
]

[project.scripts]
vlapilot = "vlapilot.interface.mcp_server:main"
vla-pi05-piper = "vla_pi05_piper.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlapilot", "examples/vla_pi05_piper/src/vla_pi05_piper"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples/vla_pi05_piper/src"]
